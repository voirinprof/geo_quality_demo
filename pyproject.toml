[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-quality-demo"
version = "0.1.0"
description = "Démo des outils de qualité de code — GMQ 710"
requires-python = ">=3.11"
dependencies = [
    "geopandas==0.14.4",
    "shapely==2.0.4",
    "pyogrio==0.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "ruff==0.4.4",
    "interrogate==1.7.0",
    "pytest==8.2.0",
    "pre-commit==3.7.0",
]

[tool.black]
line-length = 88
# Le dossier examples/ contient volontairement du code "avant" mal
# formaté, à but pédagogique — on ne veut pas que Black le corrige.
extend-exclude = "examples/"

[tool.ruff]
line-length = 88
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # erreurs, pyflakes, tri des imports

[tool.ruff.lint.isort]
known-first-party = ["geo_quality_demo"]

[tool.interrogate]
fail-under = 80
verbose = 1
exclude = ["examples", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
